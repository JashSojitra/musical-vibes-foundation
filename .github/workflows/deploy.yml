name: Deploy protected staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'JashSojitra/musical-vibes-foundation' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run validate:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run cf:build:staging
      - run: npm run validate:ci -- --built
      - run: npm run test:workers
        env:
          WORKER_CONFIG: wrangler.staging.jsonc
      - name: Deploy staging
        run: npm run cf:deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: staging-verification
          path: |
            docs/validation/migration/*-tests.json
            test-results/
            playwright-report/
          retention-days: 14
