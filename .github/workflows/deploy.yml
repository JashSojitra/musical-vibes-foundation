name: Deploy public demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-demo
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'JashSojitra/musical-vibes-foundation' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run validate:ci
      - run: npm run cf:build:demo
      - run: npm run validate:ci -- --built
      - name: Deploy demo
        run: |
          node -e "if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.CLOUDFLARE_ACCOUNT_ID) { console.error('Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See docs/DEMO-DEPLOYMENT.md.'); process.exit(1); }"
          npm run cf:deploy:demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: demo-verification
          path: |
            docs/validation/migration/*-tests.json
            test-results/
            playwright-report/
          retention-days: 14
